<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Pe Score</title>
<style>
body{margin:0;background:#020a03;color:white;font-family:sans-serif}
.header{background:#16a34a;padding:10px;text-align:center;font-weight:bold}
.score-bar{display:flex;background:#000;border-left:5px solid #22c55e;margin:10px;border-radius:8px;overflow:hidden}
.live{background:red;padding:15px 8px;font-weight:bold}
.card{background:#111;border:1px solid #22c55e;border-radius:10px;margin:10px;padding:12px}
.row{display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #222}
.row b{color:#22c55e}
</style>
</head>
<body>
<div class="header">🏏 PISHIN LIVE SCORE</div>
<div id="main"></div>
<div style="padding:10px"><a href="admin.html" style="display:block;background:#22c55e;color:black;text-align:center;padding:14px;border-radius:10px;text-decoration:none;font-weight:bold">⚙️ Admin - Striker/Bowler Update</a></div>
<script>
function load(){
let m=JSON.parse(localStorage.getItem('pishin_current')||'null');
let box=document.getElementById('main');
if(!m){box.innerHTML='<p style="text-align:center;color:gray;margin-top:60px">Koi Match Nahi<br>Admin me Striker Add Karo</p>';return;}
box.innerHTML=`<div class="score-bar"><div class="live">● LIVE</div><div style="padding:10px;flex:1"><div>${m.t1} vs ${m.t2}</div><div style="font-size:22px">${m.score}</div></div><div style="background:#22c55e;color:#000;padding:12px;text-align:center">${m.need}</div></div><div class="card"><div class="row"><span>Striker: <b style="color:#facc15">${m.striker} *</b></span><span><b>${m.striker_run}</b></span></div><div class="row"><span>Non-Striker: ${m.nonstriker}</span><span><b>${m.nonstriker_run}</b></span></div><div class="row"><span>Bowler: ${m.bowler}</span><span><b>${m.bowler_fig}</b></span></div><div class="row" style="border:0"><span>Status:</span><span style="color:#22c55e">${m.status}</span></div></div>`;
}
load();setInterval(load,2000);
</script>
</body>
</html>
