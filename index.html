<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Score</title>
<style>
body{margin:0;background:transparent;font-family:Arial}
.bar{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(90deg,#0f172a,#1e3a8a);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;border-top:3px solid #facc15}
.score{font-size:28px;font-weight:900}.need{margin-left:auto;background:#facc15;color:#000;padding:6px 12px;border-radius:20px;font-weight:900;font-size:13px}
.small{font-size:11px;color:#94a3b8}
.toss{position:fixed;top:10px;left:10px;background:#000;color:#facc15;padding:6px 10px;border-radius:20px;font-size:11px;border:1px solid #facc15}
</style></head><body>
<div class="toss" id="toss">Toss: -</div>
<div class="bar">
<div><div class="score" id="score">0/0 (0.0)</div><div class="small" id="teams">Pishin Live</div></div>
<div class="need" id="need">1st Innings</div>
</div>
<script>
function load(){
 try{
  let d=JSON.parse(localStorage.getItem('live_score')||localStorage.getItem('cric11_final')||'{}');
  if(!d.sc && d.score!==undefined) d.sc=d.score;
  if(d.sc!==undefined){
   let ov=d.over || Math.floor((d.ball||0)/6)+'.'+(d.ball||0)%6;
   document.getElementById('score').innerText=(d.sc||d.score)+' / '+(d.wk||0)+' ('+ov+' / '+(d.totalOvers||d.tOvers||10)+')';
   document.getElementById('need').innerText=d.need || 'Live';
   document.getElementById('teams').innerText=(d.teams || '')+' | This Over: '+(d.thisOver||d.over||[]).join(' ');
   document.getElementById('toss').innerText=d.toss || 'Live Score';
  }
 }catch(e){}
}
setInterval(load,1000); load();
</script></body></html>
