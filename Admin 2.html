<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PISHIN LIVE V8</title>
<style>body{font-family:Arial;background:#f1f5f9;margin:0}.header{background:#1e3a8a;color:#fff;padding:14px;text-align:center;font-weight:900}.card{background:#fff;margin:10px;border-radius:12px;padding:14px;box-shadow:0 2px 6px #0001}input,select{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #cbd5e1}.row{display:flex;gap:8px}.btn{flex:1;padding:14px;border:0;border-radius:30px;font-weight:900}.scoreBtn{width:72px;height:72px;border-radius:50%;border:0;font-weight:900;font-size:18px;margin:5px}.green{background:#16a34a;color:#fff}.yellow{background:#facc15}.red{background:#dc2626;color:#fff}.b{background:#1e3a8a;color:#fff}</style></head><body>
<div class="header">🏏 PISHIN LIVE V8 - Final Fixed</div>
<div id="p4"><div class="card"><div id="mainScore" style="font-size:28px;font-weight:900;text-align:center">0/0 (0.0/1)</div><div id="need" style="text-align:center;color:#1e3a8a;font-weight:900;margin-top:4px">1st Innings</div><div id="overInfo" style="font-size:12px;color:#64748b;margin-top:8px"></div></div>
<div class="card" style="text-align:center"><div><button class="scoreBtn green" onclick="run(0)">0</button><button class="scoreBtn green" onclick="run(1)">1</button><button class="scoreBtn green" onclick="run(2)">2</button><button class="scoreBtn yellow" onclick="undo()">UNDO</button></div><div><button class="scoreBtn green" onclick="run(3)">3</button><button class="scoreBtn green" onclick="run(4)">4</button><button class="scoreBtn green" onclick="run(6)">6</button><button class="scoreBtn yellow" onclick="swap()">SWAP</button></div><div><button class="scoreBtn yellow" onclick="wide()">WD</button><button class="scoreBtn yellow" onclick="noBall()">NB</button><button class="scoreBtn yellow" onclick="extra('LB')">LB</button><button class="scoreBtn yellow" onclick="extra('BYE')">BYE</button></div><div><button class="scoreBtn red" style="width:120px" onclick="wicket()">OUT</button></div><button class="btn b" style="width:100%;margin-top:12px" onclick="endIn()">End Innings</button><button class="btn" style="width:100%;margin-top:8px;background:#000;color:#fff" onclick="localStorage.clear();location.reload()">RESET</button></div></div>
<script>
let history=[];let d={sc:0,wk:0,ball:0,over:[],tOvers:1,tPlayers:11,innings:1,target:0,t1:"Team A",t2:"Team B",s1:{n:"Waqas",r:0,b:0},s2:{n:"Khalid",r:0,b:0}};
function render(){let ov=Math.floor(d.ball/6)+'.'+(d.ball%6);if(d.ball>=d.tOvers*6)ov=d.tOvers+'.0';document.getElementById('mainScore').innerText=d.sc+'/'+d.wk+' ('+ov+'/'+d.tOvers+')';if(d.innings==1){if(d.ball>=d.tOvers*6)document.getElementById('need').innerText='Innings Complete! End Innings دبائیں';else document.getElementById('need').innerText='1st Innings';}else{let need=d.target-d.sc;let balls=(d.tOvers*6)-d.ball;if(need<=0)document.getElementById('need').innerText='Match Won!';else if(balls<=0)document.getElementById('need').innerText='Match Over';else document.getElementById('need').innerText='Need '+need+' in '+balls+' balls';}document.getElementById('overInfo').innerText='This Over: '+d.over.join(' ')+' | '+d.s1.n+' '+d.s1.r+'('+d.s1.b+') - '+d.s2.n+' '+d.s2.r+'('+d.s2.b+')';localStorage.setItem('live_score',JSON.stringify({sc:d.sc,wk:d.wk,ball:d.ball,over:ov,totalOvers:d.tOvers,teams:d.t1+' VS '+d.t2,need:document.getElementById('need').innerText,thisOver:d.over,striker:d.s1}));}
function save(){history.push(JSON.stringify(d));}
function run(r){if(d.ball>=d.tOvers*6){alert('اوور ختم!');return;}save();d.sc+=r;d.ball++;d.over.push(r);d.s1.r+=r;d.s1.b++;if(r%2==1){let t=d.s1;d.s1=d.s2;d.s2=t}render();}
function wide(){if(d.ball>=d.tOvers*6){alert('اوور ختم');return;}save();let ex=parseInt(prompt('Wide par kitne runs? 0=Sirf 1 run, 4=Four (Total 5 runs)')||'0');if(isNaN(ex))ex=0;let total=1+ex;d.sc+=total;d.over.push(ex==0?'WD':'WD'+ex);if(ex%2==1){let t=d.s1;d.s1=d.s2;d.s2=t;}render();}
function noBall(){if(d.ball>=d.tOvers*6){alert('اوور ختم');return;}save();let bat=parseInt(prompt('No Ball par bat se kitne? 0=Sirf 1 run, 4=Four (Total 5), 6=Six (Total 7)')||'0');if(isNaN(bat))bat=0;let total=1+bat;d.sc+=total;d.s1.r+=bat;d.s1.b++;d.over.push(bat==0?'NB':'NB'+bat);if(bat%2==1){let t=d.s1;d.s1=d.s2;d.s2=t;}render();}
function extra(t){if(d.ball>=d.tOvers*6){alert('اوور ختم');return;}save();d.sc+=1;d.ball++;d.over.push(t);d.s1.b++;render();}
function wicket(){if(d.ball>=d.tOvers*6){alert('اوور ختم');return;}let nb=prompt('New Batsman?');if(!nb)return;save();d.wk++;d.ball++;d.over.push('W');d.s1={n:nb,r:0,b:0};render();}
function swap(){save();let t=d.s1;d.s1=d.s2;d.s2=t;render();}
function undo(){if(history.length==0){alert('Undo nahi hai');return;}d=JSON.parse(history.pop());render();}
function endIn(){if(d.innings==1){d.target=d.sc+1;d.innings=2;d.sc=0;d.wk=0;d.ball=0;d.over=[];alert('Target '+d.target);history=[];}else{if(confirm('Super Over?')){d.tOvers=1;d.sc=0;d.wk=0;d.ball=0;d.over=[];}}render();}
render();
</script></body></html>
