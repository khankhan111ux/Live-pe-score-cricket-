<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pishin Falcons - Live Scoring</title>
<style>
body{font-family:sans-serif;background:#0f172a;color:white;text-align:center;padding:15px}
.card{background:white;color:black;border-radius:15px;padding:20px;margin-bottom:15px}
.score{font-size:50px;font-weight:bold}
button{font-size:22px;padding:15px;margin:5px;border-radius:12px;border:none;width:70px;cursor:pointer}
.b4{background:#22c55e;color:white}
.b6{background:#2563eb;color:white}
.bW{background:#ef4444;color:white}
.b0{background:#e2e8f0}
.save{background:#f59e0b;width:95%;font-weight:bold}
</style>
</head>
<body>

<h2>🏏 Pishin Falcons - Admin Panel</h2>
<p>بس بٹن دباؤ، سکور خود بن جائے گا</p>

<div class="card">
<div id="teamName">Pishin Falcons</div>
<div class="score"><span id="runs">100</span> / <span id="wkts">3</span></div>
<div>Overs: <span id="overs">12.1</span></div>
<div style="margin-top:10px">Naseebullah: <span id="p1">43</span>* | Asmatullah: <span id="p2">24</span></div>
<div style="margin-top:10px">Target: 169 | Need: <span id="need">69</span> runs in <span id="ballsLeft">47</span> balls</div>
</div>

<div class="card">
<h3>رنز کا بٹن دباؤ</h3>
<button class="b0" onclick="add(0)">0</button>
<button class="b0" onclick="add(1)">1</button>
<button class="b0" onclick="add(2)">2</button>
<button class="b0" onclick="add(3)">3</button><br>
<button class="b4" onclick="add(4)">4</button>
<button class="b6" onclick="add(6)">6</button>
<button class="bW" onclick="addW()">W</button><br>
<button onclick="add(1)">Wide</button>
<button onclick="add(1)">No Ball</button>
<button onclick="undo()">↩ واپس</button>
</div>

<button class="save" onclick="save()">✅ SAVE - سب کو دکھاؤ</button>
<br><br>
<button onclick="resetScore()" style="background:#333;color:white;width:95%">نیا میچ شروع کرو</button>

<script>
let runs=100, wkts=3, balls=73;
let p1=43, p2=24;
let history=[];

function update(){
  let ov = Math.floor(balls/6) + "." + (balls%6);
  document.getElementById('runs').innerText=runs;
  document.getElementById('wkts').innerText=wkts;
  document.getElementById('overs').innerText=ov;
  document.getElementById('p1').innerText=p1;
  document.getElementById('p2').innerText=p2;
  let need = 169 - runs;
  let left = 120 - balls;
  document.getElementById('need').innerText=need;
  document.getElementById('ballsLeft').innerText=left;
  localStorage.setItem('liveScore', JSON.stringify({runs,wkts,balls,p1,p2}));
}

function add(r){
  history.push({runs,wkts,balls,p1,p2});
  runs+=r; balls+=1; p1+=r;
  if(r%2==1){ let t=p1; p1=p2; p2=t; }
  if(balls%6==0){ let t=p1; p1=p2; p2=t; }
  update();
}
function addW(){
  history.push({runs,wkts,balls,p1,p2});
  wkts+=1; balls+=1; p1=0;
  update();
}
function undo(){
  if(history.length>0){
    let h=history.pop();
    runs=h.runs; wkts=h.wkts; balls=h.balls; p1=h.p1; p2=h.p2;
    update();
  }
}
function save(){
  update();
  alert("ہو گیا بھائی! سکور سب کو دکھا دیا: " + runs + "/" + wkts);
}
function resetScore(){
  runs=0; wkts=0; balls=0; p1=0; p2=0; history=[];
  update();
}
update();
</script>
</body>
</html>
